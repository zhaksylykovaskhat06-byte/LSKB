<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>JUZ40 Физика лигасы · 2-тур</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b1020; --panel:rgba(255,255,255,.05); --line:rgba(255,255,255,.11);
  --gold:#f5c542; --gold2:#d99a16; --ink:#141a2e; --muted:#a6afc8; --ok:#22b357;
  --c0:#e5484d; --c1:#2f6fed; --c2:#e39b0b; --c3:#1f9f5f; --c4:#8b5cf6; --c5:#0ea5b7;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:Montserrat,system-ui,sans-serif;color:#fff;
  background:radial-gradient(1000px 520px at 50% -12%,#2a2f6b 0,transparent 62%),
             radial-gradient(700px 420px at 105% 105%,#3b2a0b 0,transparent 60%),var(--bg);
  background-attachment:fixed}
button{font:inherit;cursor:pointer;border:0}
.view{display:none;min-height:100vh;min-height:100dvh;padding:24px;flex-direction:column}
.view.on{display:flex}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-weight:900;font-size:18px}
.brand b{color:var(--gold)}
.muted{color:var(--muted)}
.btn{background:linear-gradient(180deg,var(--gold),var(--gold2));color:#2a1a00;font-weight:900;padding:14px 24px;border-radius:14px;font-size:17px;box-shadow:0 5px 0 #8a5d05}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #8a5d05}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:#fff;border:2px solid var(--line);box-shadow:none;font-weight:700;padding:10px 16px;font-size:14px}

/* карточкалар */
.title{text-align:center;margin:26px 0 6px}
.title h1{margin:0;font-size:clamp(28px,4.4vw,56px);font-weight:900;line-height:1.05}
.title h1 b{color:var(--gold)}
.grid{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(12px,2vw,24px);align-content:center;max-width:1300px;width:100%;margin:22px auto 0}
.grid .card:nth-child(n+5){transform:translateX(calc(50% + clamp(6px,1vw,12px)))}
@media (max-width:760px){.card{height:clamp(140px,26vh,260px)}.grid{grid-template-columns:repeat(2,1fr)}.grid .card:nth-child(n+5){transform:none}}
.card{position:relative;height:clamp(150px,34vh,420px);border-radius:22px;background:linear-gradient(155deg,#2c3a7c,#151c41 70%);border:2px solid #3e4c94;color:var(--gold);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;box-shadow:0 14px 30px #0007;transition:transform .15s,box-shadow .15s,border-color .15s;overflow:hidden}
.card::before{content:"";position:absolute;inset:10px;border:1px dashed rgba(245,197,66,.35);border-radius:16px;pointer-events:none}
.card:hover{border-color:var(--gold);box-shadow:0 20px 40px #000a}
.card .num{font-size:clamp(64px,9vw,140px);font-weight:900;line-height:1}
.card .lbl{font-size:clamp(12px,1.2vw,16px);font-weight:800;letter-spacing:.14em;color:#c9cfe6}
.card.done{background:#10142a;border-color:#1d2345;color:#3a4166}
.card.done .lbl{color:#3a4166}
.card .badge{position:absolute;top:16px;right:16px;font-size:12px;font-weight:900;padding:4px 9px;border-radius:999px;background:var(--ok);color:#fff;letter-spacing:0}

/* тапсырма */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.qnum{font-size:clamp(20px,2.2vw,28px);font-weight:900}
.qnum b{color:var(--gold)}
.qtext{background:#fff;color:var(--ink);border-radius:22px;padding:clamp(18px,2.4vw,32px);font-size:clamp(22px,2.8vw,40px);font-weight:800;line-height:1.28;text-align:center}
.qimg{display:block;max-width:100%;max-height:36vh;margin:16px auto 0;border-radius:14px;background:#fff}
.qmid{display:flex;align-items:center;justify-content:center;gap:16px;margin:18px 0}
.timer{min-width:110px;height:72px;padding:0 18px;border-radius:999px;background:#26306a;border:3px solid var(--gold);display:grid;place-items:center;font-size:36px;font-weight:900}
.timer.low{background:#e5484d;border-color:#fff}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:auto}
@media (max-width:760px){.opts{grid-template-columns:1fr}}
.opt{border-radius:16px;padding:18px 22px;font-size:clamp(17px,2vw,28px);font-weight:800;display:flex;align-items:center;gap:16px;color:#fff;min-height:80px;transition:opacity .3s,box-shadow .3s}
.opt .lt{width:44px;height:44px;border-radius:12px;background:#0003;display:grid;place-items:center;flex:none;font-weight:900}
.o0{background:var(--c0)} .o1{background:var(--c1)} .o2{background:var(--c2)} .o3{background:var(--c3)} .o4{background:var(--c4)} .o5{background:var(--c5)}
.opts.revealed .opt{opacity:.25}
.opts.revealed .opt.right{opacity:1;box-shadow:0 0 0 5px #fff,0 0 0 11px rgba(34,179,87,.7)}
.answer{display:none;margin-top:16px;background:var(--ok);border-radius:16px;padding:16px 20px;font-size:clamp(18px,2vw,26px);font-weight:800;animation:pop .35s}
.answer.on{display:block}
.answer small{display:block;font-weight:600;font-size:.72em;margin-top:6px;opacity:.95;line-height:1.4}
.bottom{display:flex;justify-content:space-between;gap:12px;margin-top:18px;flex-wrap:wrap}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
</style>
</head>
<body>

<!-- ============ КАРТОЧКАЛАР ============ -->
<section class="view on" id="v-cards">
  <div class="top">
    <div class="brand">JUZ40 <b>Физика лигасы</b></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn ghost" id="btn-reset">Карточкаларды жаңарту</button>
      <button class="btn ghost btn-fs">Толық экран</button>
    </div>
  </div>
  <div class="title"><h1>2-тур · <b>Интеллектуалды жарыс</b></h1><div class="muted" style="font-weight:700;margin-top:8px">Карточканы таңдаңыз</div></div>
  <div class="grid" id="grid"></div>
</section>

<!-- ============ ТАПСЫРМА ============ -->
<section class="view" id="v-task">
  <div class="qhead">
    <div class="qnum"><b id="t-num"></b>-карточка</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn ghost btn-fs">Толық экран</button>
    </div>
  </div>
  <div class="qtext" id="t-text"></div>
  <img class="qimg" id="t-img" alt="" hidden>
  <div class="qmid">
    <div class="timer" id="t-timer"></div>
    <button class="btn ghost" id="btn-timer">▶ Уақытты бастау</button>
  </div>
  <div class="opts" id="t-opts"></div>
  <div class="answer" id="t-answer"></div>
  <div class="bottom">
    <button class="btn ghost" id="btn-back">← Карточкалар</button>
    <button class="btn" id="btn-reveal">Дұрыс жауапты көрсету</button>
  </div>
</section>

<script>
/* =====================================================================
   ТАПСЫРМАЛАР. Әр карточкаға бір тапсырма.
     text    — тапсырма мәтіні (сұрақ белгісіз)
     options — варианттар (2–6);  answer — дұрыс варианттың реті (0-ден)
     image   — міндетті емес: сурет сілтемесі
     time    — секунд (әдепкі 60)
     explain — міндетті емес: дұрыс жауаппен бірге шығатын түсініктеме
   ===================================================================== */
const CARDS = [
  { text:'1-тапсырма мәтіні осында болады', options:['А нұсқасы','B нұсқасы','C нұсқасы','D нұсқасы'], answer:0 },
  { text:'2-тапсырма мәтіні осында болады', options:['А нұсқасы','B нұсқасы','C нұсқасы','D нұсқасы'], answer:0 },
  { text:'3-тапсырма мәтіні осында болады', options:['А нұсқасы','B нұсқасы','C нұсқасы','D нұсқасы'], answer:0 },
  { text:'4-тапсырма мәтіні осында болады', options:['А нұсқасы','B нұсқасы','C нұсқасы','D нұсқасы'], answer:0 },
  { text:'5-тапсырма мәтіні осында болады', options:['А нұсқасы','B нұсқасы','C нұсқасы','D нұсқасы'], answer:0 },
  { text:'6-тапсырма мәтіні осында болады', options:['А нұсқасы','B нұсқасы','C нұсқасы','D нұсқасы'], answer:0 },
  { text:'7-тапсырма мәтіні осында болады', options:['А нұсқасы','B нұсқасы','C нұсқасы','D нұсқасы'], answer:0 },
];

/* ===================================================================== */
const $ = s => document.querySelector(s);
const LETTERS = 'ABCDEF';
const KEY = 'tur2-opened-v1';
let opened = new Set(), cur = -1, tick = null, left = 0, running = false;
try { opened = new Set(JSON.parse(localStorage.getItem(KEY)||'[]')); } catch(_){}
function save(){ try { localStorage.setItem(KEY, JSON.stringify([...opened])); } catch(_){} }
function h(tag, props, ...kids){
  const el=document.createElement(tag);
  for (const [k,v] of Object.entries(props||{})){ if(k==='class') el.className=v; else if(k.startsWith('on')) el.addEventListener(k.slice(2),v); else el.setAttribute(k,v); }
  kids.flat().forEach(k=>{ if(k!=null) el.append(k.nodeType?k:document.createTextNode(String(k))); });
  return el;
}
function show(id){ document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id===id)); window.scrollTo(0,0); }

function renderCards(){
  const g=$('#grid'); g.innerHTML='';
  CARDS.forEach((c,i)=>g.append(h('button',{class:'card'+(opened.has(i)?' done':''),onclick:()=>openTask(i)},
    opened.has(i)? h('span',{class:'badge'},'✓ ашылды') : null,
    h('span',{class:'num'},i+1), h('span',{class:'lbl'},'КАРТОЧКА'))));
  show('v-cards');
}

function openTask(i){
  cur=i; const c=CARDS[i];
  opened.add(i); save();
  $('#t-num').textContent=i+1;
  $('#t-text').textContent=c.text;
  const img=$('#t-img'); if (c.image){ img.src=c.image; img.hidden=false; } else { img.hidden=true; img.removeAttribute('src'); }
  const box=$('#t-opts'); box.innerHTML=''; box.classList.remove('revealed');
  c.options.forEach((o,k)=>box.append(h('div',{class:'opt o'+k+(k===c.answer?' right':'')},h('span',{class:'lt'},LETTERS[k]),h('span',{},o))));
  const ans=$('#t-answer'); ans.classList.remove('on'); ans.innerHTML='';
  ans.append('✓ Дұрыс жауап: '+LETTERS[c.answer]+') '+c.options[c.answer]); if (c.explain) ans.append(h('small',{},c.explain));
  $('#btn-reveal').disabled=false;
  stopTimer(); left=(c.time||60); drawTimer(); $('#btn-timer').textContent='▶ Уақытты бастау';
  show('v-task');
}
function drawTimer(){ const m=Math.floor(left/60), s=left%60; $('#t-timer').textContent=m+':'+String(s).padStart(2,'0'); $('#t-timer').classList.toggle('low',running&&left<=10); }
function stopTimer(){ clearInterval(tick); running=false; }
$('#btn-timer').onclick=()=>{
  if (running){ stopTimer(); $('#btn-timer').textContent='▶ Жалғастыру'; drawTimer(); return; }
  if (left<=0) left=(CARDS[cur].time||60);
  running=true; $('#btn-timer').textContent='⏸ Тоқтату';
  tick=setInterval(()=>{ left--; drawTimer(); if(left<=0){ stopTimer(); $('#btn-timer').textContent='↻ Қайта бастау'; drawTimer(); } },1000);
};
$('#btn-reveal').onclick=()=>{ stopTimer(); $('#t-opts').classList.add('revealed'); $('#t-answer').classList.add('on'); $('#btn-reveal').disabled=true; $('#btn-timer').textContent='▶ Уақытты бастау'; };
$('#btn-back').onclick=()=>{ stopTimer(); renderCards(); };
$('#btn-reset').onclick=()=>{ if(!confirm('Барлық карточка жабық күйге қайтарылсын ба')) return; opened.clear(); save(); renderCards(); };
document.querySelectorAll('.btn-fs').forEach(b=>b.onclick=()=>{ document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{}); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape' && $('#v-task').classList.contains('on') && !document.fullscreenElement){ stopTimer(); renderCards(); } });
renderCards();
</script>
</body>
</html>
